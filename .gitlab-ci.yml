# ---------------------------------------------------------------------------
# Green Operations — OPTIMIZED pipeline
#
# Compared with ci/baseline.gitlab-ci.yml, three isolated changes:
#
#   OPT-1  npm dependency cache keyed on package-lock.json with a fallback key
#          (in ci/child-app-jobs.gitlab-ci.yml).
#   OPT-2  Documentation-only changes skip lint/test/build. The decision is
#          made by an explicit `classify` job that diffs the whole pushed range
#          with git and fails safe to "code". Secret detection ALWAYS runs.
#   OPT-3  workflow:rules prevents duplicate branch + merge-request pipelines.
#
# Nothing here weakens quality or security coverage for code changes.
# ---------------------------------------------------------------------------
stages: [classify, app, security, evidence, deploy]

default:
  image: node:22-alpine
  interruptible: true

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  GREEN_OPS_ARM: "optimized"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  GIT_DEPTH: "50"

.node:
  before_script:
    - node --version
    - npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline --no-audit --no-fund
  cache:
    key:
      files: [package-lock.json]
      prefix: npm
    fallback_keys: [npm-default]
    paths: [.npm/]
    policy: pull

# Decide what this change is. No dependencies needed: plain node + git.
classify:
  stage: classify
  before_script:
    - command -v git >/dev/null || apk add --no-cache git >/dev/null
  script:
    - node scripts/classify_change.mjs
  artifacts:
    paths: [generated/]
    reports:
      dotenv: generated/classify.env
    expire_in: 30 days

# Run the selected child pipeline and wait for it.
app:
  stage: app
  needs: [classify]
  trigger:
    include:
      - artifact: generated/child.yml
        job: classify
    strategy: depend

# Security gate: always runs, regardless of which files changed.
secret_detection:
  stage: security
  rules:
    - when: always

collect_evidence:
  stage: evidence
  extends: .node
  when: always
  script:
    - node scripts/collect_evidence.mjs --arm "$GREEN_OPS_ARM" --class "$CHANGE_CLASS"
  artifacts:
    paths: [evidence/runs/]
    expire_in: 30 days

# Publishes the Field Notes evidence page from committed evidence only.
pages:
  stage: deploy
  extends: .node
  # Only committed, finalised evidence: do not pull this pipeline's own
  # provisional collect_evidence artifact into the page.
  dependencies: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run evidence:all
    - npm run site
  artifacts:
    paths: [public/]
